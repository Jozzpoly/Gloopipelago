name: M5a dynamic habitat memory audit probe

on:
  push:
    branches:
      - m5a-dynamic-habitat-memory-audit-2026-09-10
  workflow_dispatch:

jobs:
  structural:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use qualification Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Verify audit probe is causally inert when disabled
        run: node tools/m5a-habitat-memory-probe.mjs structural > m5a-structural.json
      - name: Maintain exact M4 construction
        run: node tools/m4a-final.mjs construction > m4a-construction-maintained.json
      - name: Protected M0 maintained core
        run: node tools/m0.mjs verify
      - name: Upload structural evidence
        uses: actions/upload-artifact@v4
        with:
          name: m5a-structural
          path: |
            m5a-structural.json
            m4a-construction-maintained.json
          if-no-files-found: error

  matrix:
    needs: structural
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use qualification Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Run paired post-M4 habitat-memory matrix
        run: node tools/m5a-habitat-memory-probe.mjs matrix > m5a-habitat-memory-matrix.json
      - name: Upload matrix evidence
        uses: actions/upload-artifact@v4
        with:
          name: m5a-habitat-memory-matrix
          path: m5a-habitat-memory-matrix.json
          if-no-files-found: error
