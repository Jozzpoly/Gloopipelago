name: M4b living world legibility qualification

on:
  push:
    branches:
      - m4b-living-world-legibility-2026-09-10
  workflow_dispatch:

jobs:
  semantics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use qualification Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: M4b mapping and draw neutrality
        run: node tools/m4b.mjs > m4b-semantics.json
      - name: Maintain exact M4a construction
        run: node tools/m4a-final.mjs construction > m4a-construction-maintained.json
      - name: Maintain x40 execution semantics
        run: node tools/x40.mjs > x40-maintained.json
      - name: Protected M0 maintained core
        run: node tools/m0.mjs verify
      - name: Protected M1.1 and M2a smoke
        run: |
          node tools/m11.mjs verify
          node tools/m2a.mjs parity off > m2a-off.json
          node tools/m2a.mjs parity collector > m2a-collector.json
      - name: Upload semantic evidence
        uses: actions/upload-artifact@v4
        with:
          name: m4b-semantics
          path: |
            m4b-semantics.json
            m4a-construction-maintained.json
            x40-maintained.json
            m2a-*.json
          if-no-files-found: error

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use qualification Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Prepare real Chromium gate
        run: |
          npm install --no-save --ignore-scripts puppeteer-core@24.16.0
          which google-chrome || which google-chrome-stable || which chromium || which chromium-browser
      - name: Real-browser M4b qualification and captures
        run: node tools/m4b-browser.mjs > m4b-browser-console.json
      - name: Verify deterministic standalone
        run: |
          node tools/build-standalone.mjs verify > m4b-build-verify.json
          sha256sum dist/gloopipelago.html > m4b-standalone.sha256
      - name: Upload browser evidence, screenshots and exact standalone
        uses: actions/upload-artifact@v4
        with:
          name: m4b-browser
          path: |
            m4b-browser-console.json
            m4b-browser-results/m4b-browser-qualification.json
            m4b-browser-results/*.png
            m4b-build-verify.json
            m4b-standalone.sha256
            dist/gloopipelago.html
          if-no-files-found: error
