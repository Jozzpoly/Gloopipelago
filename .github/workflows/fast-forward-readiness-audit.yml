name: Fast-forward readiness audit

on:
  push:
    branches:
      - audit/m3-fast-forward-readiness-2026-09-10
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Verify protected M0 core
        run: node tools/m0.mjs verify
      - name: Run fast-forward readiness audit
        shell: bash
        run: |
          set -o pipefail
          mkdir -p audit-results
          node tools/fast-forward-readiness-audit.mjs | tee audit-results/fast-forward-readiness.json
      - name: Map core load surface
        shell: bash
        run: |
          set -o pipefail
          node tools/core-load-surface-audit.mjs | tee audit-results/core-load-surface.json
      - name: Prepare real Chromium harness
        run: |
          npm install --no-save --ignore-scripts puppeteer-core@24.16.0
          which google-chrome || which google-chrome-stable || which chromium || which chromium-browser
      - name: Run real-browser readiness audit
        shell: bash
        run: |
          set -o pipefail
          node tools/browser-readiness-audit.mjs | tee audit-results/browser-readiness-console.json
      - name: Probe decoupled fast-forward in Chromium
        shell: bash
        run: |
          set -o pipefail
          node tools/fast-forward-browser-probe.mjs | tee audit-results/fast-forward-browser-probe-console.json
      - name: Upload audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: fast-forward-readiness-audit
          path: |
            audit-results/fast-forward-readiness.json
            audit-results/core-load-surface.json
            audit-results/browser-readiness.json
            audit-results/browser-readiness-console.json
            audit-results/fast-forward-browser-probe.json
            audit-results/fast-forward-browser-probe-console.json
            audit-results/wide.png
            audit-results/narrow.png
