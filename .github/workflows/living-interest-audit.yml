name: Living world interest audit

on:
  push:
    branches:
      - audit/living-world-interest-2026-09-10
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Record runtime and core hash
        run: |
          node --version
          sha256sum src/core/v1-mirror.mjs
      - name: Selected long-horizon follow-up
        run: node tools/living-interest-long-selected.mjs > living-interest-long-selected.json
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: living-world-interest-long-selected
          path: living-interest-long-selected.json
          if-no-files-found: error
