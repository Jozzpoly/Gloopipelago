name: Living world interest audit

on:
  push:
    branches:
      - audit/living-world-interest-2026-09-10
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Record runtime and core hash
        run: |
          node --version
          sha256sum src/core/v1-mirror.mjs
      - name: Multipatch diversity falsification probe
        run: node tools/multipatch-diversity-probe.mjs > multipatch-diversity-probe.json
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: multipatch-diversity-probe
          path: multipatch-diversity-probe.json
          if-no-files-found: error
