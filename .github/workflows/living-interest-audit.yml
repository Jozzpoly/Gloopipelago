name: Living world interest audit

on:
  push:
    branches:
      - audit/living-world-interest-2026-09-10
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Record runtime and core hash
        run: |
          node --version
          sha256sum src/core/v1-mirror.mjs
      - name: Long baseline
        run: node tools/living-interest-audit.mjs baseline > living-interest-baseline.json
      - name: Existing-knob matrix
        run: node tools/living-interest-audit.mjs matrix > living-interest-matrix.json
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: living-world-interest-audit
          path: |
            living-interest-baseline.json
            living-interest-matrix.json
          if-no-files-found: error
